name: Fetch Job Ads

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  id-token: write
  contents: read

concurrency:
  group: fetch-job-ads
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2

jobs:
  fetch:
    name: Fetch graduate job ads
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Load secrets
        run: |
          for pair in \
            SUPABASE_SERVICE_ROLE_KEY=univise/staging/supabase-service-role-key \
            ADZUNA_APP_ID=univise/staging/adzuna-app-id \
            ADZUNA_APP_KEY=univise/staging/adzuna-app-key; do
            name="${pair%%=*}"
            value=$(aws secretsmanager get-secret-value --secret-id "${pair#*=}" --query SecretString --output text)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Fetch and store
        working-directory: backend
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: python -m scripts.job_ads_fetch apply
